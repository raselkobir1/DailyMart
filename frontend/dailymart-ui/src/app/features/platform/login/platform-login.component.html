<div class="login-wrap">
  <div class="login-aside">
    <h1>DailyMart</h1>
    <p>Platform administration</p>
    <ul>
      <li>🏢 View every company on the platform</li>
      <li>⏸️ Suspend or reactivate an account</li>
    </ul>
  </div>

  <div class="login-main">
    <div class="login-card">
      <h2>Platform sign in</h2>
      <p class="subtitle">For DailyMart operators only</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label>Username</label>
          <input class="input" formControlName="username" autocomplete="username" />
        </div>

        <div class="field">
          <label>Password</label>
          <input class="input" type="password" formControlName="password" autocomplete="current-password" />
        </div>

        @if (error()) {
          <p class="field error">{{ error() }}</p>
        }

        <button class="btn btn-primary" type="submit" style="width: 100%" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner"></span>
          } @else {
            Sign in
          }
        </button>
      </form>
    </div>
  </div>
</div>
