<div class="page-head">
  <div>
    <h2>Menus</h2>
    <div class="subtitle">{{ menus().length }} menus</div>
  </div>
</div>

@if (loading()) {
  <div class="spinner-page"><span class="spinner lg"></span></div>
} @else {
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Key</th>
            <th>Label</th>
            <th>Route</th>
            <th>Icon</th>
            <th class="num">Sort</th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track row.id) {
            <tr>
              <td>{{ row.key }}</td>
              <td>{{ row.depth > 0 ? '↳ ' : '' }}{{ row.label }}</td>
              <td>{{ row.route }}</td>
              <td>{{ row.icon }}</td>
              <td class="num">{{ row.sortOrder }}</td>
            </tr>
          } @empty {
            <tr class="empty-row"><td colspan="5">No menus yet.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
}
